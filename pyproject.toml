[project]
name = "midi-autorecord"
version = "0.1.0"
description = "Headless daemon that records MIDI from named ALSA sequencer devices to SMF files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mido>=1.3.2",
  # Official pyalsa is not on PyPI; install the tagged source from the ALSA
  # project. Needs a C compiler and libasound headers at build time.
  "pyalsa @ git+https://github.com/alsa-project/alsa-python@v1.2.14",
]

[project.scripts]
midi-autorecord = "midi_autorecord.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midi_autorecord"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py314"
